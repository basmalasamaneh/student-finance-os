openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: App-owned credentials and sessions
  - name: profile
    description: Owner-only onboarding
  - name: finance
    description: Simulated student finance
  - name: campus
    description: Simulated campus catalog
  - name: planning
    description: Owner-only student budgets and estimates
  - name: goals
    description: Reserved student savings and consent-scoped simulated parent funding
paths:
  /goals:
    get:
      operationId: listSavingsGoals
      tags: [goals]
      responses:
        "200": { description: All owner goals including archived, content: { application/json: { schema: { $ref: "#/components/schemas/SavingsGoalsOverview" } } } }
    post:
      operationId: createSavingsGoal
      tags: [goals]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SavingsGoalInput" } } } }
      responses:
        "201": { description: Created at zero reserved balance, content: { application/json: { schema: { $ref: "#/components/schemas/SavingsGoal" } } } }
  /goals/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getSavingsGoal
      tags: [goals]
      responses:
        "200": { description: Owner goal, content: { application/json: { schema: { $ref: "#/components/schemas/SavingsGoal" } } } }
    put:
      operationId: updateSavingsGoal
      tags: [goals]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SavingsGoalInput" } } } }
      responses:
        "200": { description: Edited metadata without changing reserved funds, content: { application/json: { schema: { $ref: "#/components/schemas/SavingsGoal" } } } }
  /goals/{id}/status:
    post:
      operationId: changeSavingsGoalStatus
      tags: [goals]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SavingsGoalAction" } } } }
      responses:
        "200": { description: Updated status; archived funds remain reserved, content: { application/json: { schema: { $ref: "#/components/schemas/SavingsGoal" } } } }
  /goals/{id}/contributions:
    post:
      operationId: contributeToSavingsGoal
      tags: [goals]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StudentGoalContributionInput" } } } }
      responses:
        "201": { description: Atomic available-to-reserved movement, content: { application/json: { schema: { $ref: "#/components/schemas/GoalContributionReceipt" } } } }
  /goals/{id}/history:
    get:
      operationId: getSavingsGoalHistory
      tags: [goals]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Owner-only immutable goal events newest first, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/GoalHistoryEntry" } } } } }
  /goals/{id}/invitations:
    parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: listGoalInvitations
      tags: [goals]
      responses:
        "200": { description: Owner-only consents; never returns raw tokens, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/GoalInvitation" } } } } }
    post:
      operationId: createGoalInvitation
      tags: [goals]
      description: Explicit limited consent to one authenticated parent to view this goal's public funding summary and simulate funding. Token is shown only in this response, hashed at rest, single-use and expires after seven days. No idempotency response storage of the raw token.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GoalConsentInput" } } } }
      responses:
        "201": { description: Share the token privately; no email is sent, content: { application/json: { schema: { $ref: "#/components/schemas/GoalInvitationCreated" } } } }
  /goals/{id}/invitations/{invitationId}:
    delete:
      operationId: revokeGoalInvitation
      tags: [goals]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: invitationId, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Token and any redeemed grant revoked; funds retained }
  /parent/goals:
    get:
      operationId: listParentFundingGoals
      tags: [goals]
      responses:
        "200": { description: Parent principal only; exact goals with unrevoked consent, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ParentFundingGoal" } } } } }
  /parent/goal-invitations/redeem:
    post:
      operationId: redeemGoalInvitation
      tags: [goals]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GoalInvitationRedemption" } } } }
      responses:
        "200": { description: Authenticated parent receives limited exact-goal consent, content: { application/json: { schema: { $ref: "#/components/schemas/ParentFundingGoal" } } } }
  /parent/goals/{id}/contributions:
    post:
      operationId: fundSavingsGoalAsParent
      tags: [goals]
      description: Authenticated parent principal with current exact-goal consent only. Simulated external funding, no bank connection and no student wallet deduction.
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ParentGoalContributionInput" } } } }
      responses:
        "201": { description: Limited receipt with no student account or profile data, content: { application/json: { schema: { $ref: "#/components/schemas/ParentGoalContributionReceipt" } } } }
  /planning:
    get:
      operationId: getFinancialPlan
      tags: [planning]
      responses:
        "200":
          description: Live owner-only monthly estimate and budget spending
          content: { application/json: { schema: { $ref: "#/components/schemas/FinancialPlan" } } }
  /planning/budgets:
    post:
      operationId: createBudget
      tags: [planning]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BudgetInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Budget" } } } }
  /planning/budgets/{id}:
    put:
      operationId: updateBudget
      tags: [planning]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BudgetInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Budget" } } } }
    delete:
      operationId: deleteBudget
      tags: [planning]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { "204": { description: Deleted } }
  /planning/recurring-expenses:
    post:
      operationId: createRecurringExpense
      tags: [planning]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RecurringExpenseInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/RecurringExpense" } } } }
  /planning/recurring-expenses/{id}:
    put:
      operationId: updateRecurringExpense
      tags: [planning]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RecurringExpenseInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/RecurringExpense" } } } }
    delete:
      operationId: deleteRecurringExpense
      tags: [planning]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { "204": { description: Deleted } }
  /planning/lines:
    post:
      operationId: createPlanLine
      tags: [planning]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanLineInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PlanLine" } } } }
  /planning/lines/{id}:
    put:
      operationId: updatePlanLine
      tags: [planning]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanLineInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/PlanLine" } } } }
    delete:
      operationId: deletePlanLine
      tags: [planning]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { "204": { description: Deleted } }
  /planning/commute-override:
    put:
      operationId: savePlanCommuteOverride
      tags: [planning]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CommuteOverrideInput" } } } }
      responses:
        "200": { description: Saved setting, content: { application/json: { schema: { $ref: "#/components/schemas/CommuteOverride" } } } }
  /finance/accounts:
    get:
      operationId: listFinanceAccounts
      tags: [finance]
      responses:
        "200":
          description: Owner accounts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FinanceAccount" } }
    post:
      operationId: createFinanceAccount
      tags: [finance]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceAccountInput" } } } }
      responses:
        "201":
          description: Zero-balance account
          content: { application/json: { schema: { $ref: "#/components/schemas/FinanceAccount" } } }
  /finance/accounts/{id}:
    get:
      operationId: getFinanceAccount
      tags: [finance]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Account details
          content: { application/json: { schema: { $ref: "#/components/schemas/FinanceAccount" } } }
  /finance/recipients/{id}:
    get:
      operationId: lookupFinanceRecipient
      tags: [finance]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Minimal verified recipient identity; never reveals balances
          content: { application/json: { schema: { $ref: "#/components/schemas/FinanceRecipient" } } }
  /finance/transactions:
    get:
      operationId: listFinanceTransactions
      tags: [finance]
      responses:
        "200":
          description: Recent owner ledger entries
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FinanceTransaction" } } } }
  /finance/history:
    get:
      operationId: getFinanceHistory
      tags: [finance]
      description: Owner-only immutable ledger, newest first by createdAt then id. Dates are inclusive UTC calendar days; amounts are integer minor units in amountCurrency.
      parameters:
        - { in: query, name: search, schema: { type: string, minLength: 1, maxLength: 120 } }
        - { in: query, name: category, schema: { type: string, maxLength: 80 } }
        - { in: query, name: type, schema: { $ref: "#/components/schemas/FinanceSemanticType" } }
        - { in: query, name: dateFrom, schema: { type: string, format: date } }
        - { in: query, name: dateTo, schema: { type: string, format: date } }
        - { in: query, name: amountMin, schema: { type: integer, minimum: 0, maximum: 9007199254740991 } }
        - { in: query, name: amountMax, schema: { type: integer, minimum: 0, maximum: 9007199254740991 } }
        - { in: query, name: amountCurrency, schema: { type: string, enum: [ILS, USD, JOD] } }
        - { in: query, name: accountId, schema: { type: string, format: uuid } }
        - { in: query, name: parentTransferId, schema: { type: string, format: uuid } }
        - { in: query, name: campusId, schema: { type: string, format: uuid } }
        - { in: query, name: universityId, schema: { type: string, format: uuid } }
        - { in: query, name: goalId, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 100000 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Filtered owner ledger; empty items with total 0 means no matches
          content: { application/json: { schema: { $ref: "#/components/schemas/FinanceHistoryPage" } } }
  /finance/history/filter-options:
    get:
      operationId: getFinanceHistoryFilterOptions
      tags: [finance]
      responses:
        "200":
          description: Static bilingual taxonomy plus owner-derived account and campus facets; goals are not implemented
          content: { application/json: { schema: { $ref: "#/components/schemas/FinanceHistoryFilterOptions" } } }
  /finance/transactions/{id}:
    get:
      operationId: getFinanceTransaction
      tags: [finance]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Immutable owner receipt
          content: { application/json: { schema: { $ref: "#/components/schemas/FinanceTransaction" } } }
  /finance/movements:
    post:
      operationId: createFinanceMovement
      tags: [finance]
      description: Simulated external receive/deposit/add or send/withdrawal, or atomic transfer to an exact account identifier. All require a unique Idempotency-Key header.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceMovementInput" } } } }
      responses:
        "201":
          description: Immutable receipt
          content: { application/json: { schema: { $ref: "#/components/schemas/FinanceTransaction" } } }
  /finance/requests:
    get:
      operationId: listMoneyRequests
      tags: [finance]
      responses:
        "200":
          description: Requests issued or addressed to owner
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MoneyRequest" } } } }
    post:
      operationId: createMoneyRequest
      tags: [finance]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MoneyRequestInput" } } } }
      responses:
        "201":
          description: Pending request
          content: { application/json: { schema: { $ref: "#/components/schemas/MoneyRequest" } } }
  /finance/requests/{id}/decision:
    post:
      operationId: decideMoneyRequest
      tags: [finance]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MoneyRequestDecision" } } } }
      responses:
        "200":
          description: Updated request
          content: { application/json: { schema: { $ref: "#/components/schemas/MoneyRequest" } } }
  /finance/summary:
    get:
      operationId: getFinanceSummary
      tags: [finance]
      responses:
        "200":
          description: Derived per-currency monthly cashflow and category totals, not a budget or forecast
          content: { application/json: { schema: { $ref: "#/components/schemas/FinanceSummary" } } }
  /campus/catalog:
    get:
      operationId: listCampusCatalog
      tags: [campus]
      responses:
        "200":
          description: Configured campuses and services
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CampusUniversity" } } } }
  /campus/demo/install:
    post:
      operationId: installCampusDemo
      tags: [campus]
      description: Authenticated student opt-in install of a global fictional demo catalog. Idempotent; no credentials or balance seeds.
      responses:
        "200":
          description: Current catalog including persisted demo
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CampusUniversity" } } } }
  /campus/admin/universities:
    post:
      operationId: createCampusUniversity
      tags: [campus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampusUniversityInput" } } } }
      responses:
        "201":
          description: Created university
          content: { application/json: { schema: { $ref: "#/components/schemas/CampusUniversity" } } }
  /campus/admin/universities/{id}:
    put:
      operationId: updateCampusUniversity
      tags: [campus]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampusUniversityInput" } } } }
      responses:
        "200":
          description: Updated university
          content: { application/json: { schema: { $ref: "#/components/schemas/CampusUniversity" } } }
  /campus/admin/campuses:
    post:
      operationId: createCampus
      tags: [campus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampusInput" } } } }
      responses:
        "201":
          description: Created campus
          content: { application/json: { schema: { $ref: "#/components/schemas/Campus" } } }
  /campus/admin/campuses/{id}:
    put:
      operationId: updateCampus
      tags: [campus]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampusInput" } } } }
      responses:
        "200":
          description: Updated campus
          content: { application/json: { schema: { $ref: "#/components/schemas/Campus" } } }
  /campus/admin/services:
    post:
      operationId: createCampusService
      tags: [campus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampusServiceInput" } } } }
      responses:
        "201":
          description: Created merchant/service
          content: { application/json: { schema: { $ref: "#/components/schemas/CampusService" } } }
  /campus/admin/services/{id}:
    put:
      operationId: updateCampusService
      tags: [campus]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampusServiceInput" } } } }
      responses:
        "200":
          description: Updated service
          content: { application/json: { schema: { $ref: "#/components/schemas/CampusService" } } }
    delete:
      operationId: archiveCampusService
      tags: [campus]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: "Archived from payments; retained for historical receipts" }
  /campus/admin/products:
    post:
      operationId: createCampusProduct
      tags: [campus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampusProductInput" } } } }
      responses:
        "201":
          description: Created price
          content: { application/json: { schema: { $ref: "#/components/schemas/CampusProduct" } } }
  /campus/admin/products/{id}:
    put:
      operationId: updateCampusProduct
      tags: [campus]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampusProductInput" } } } }
      responses:
        "200":
          description: Updated price
          content: { application/json: { schema: { $ref: "#/components/schemas/CampusProduct" } } }
    delete:
      operationId: archiveCampusProduct
      tags: [campus]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: "Archived from payments; retained for historical receipts" }
  /campus/payments:
    post:
      operationId: createCampusPayment
      tags: [campus]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampusPaymentInput" } } } }
      responses:
        "201":
          description: Simulated payment receipt with server-priced items
          content: { application/json: { schema: { $ref: "#/components/schemas/FinanceTransaction" } } }
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignUpInput" }
      responses:
        "201":
          description: Registered and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /auth/login:
    post:
      operationId: logIn
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /auth/logout:
    post:
      operationId: logOut
      tags: [auth]
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogoutResult" }
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Authenticated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      responses:
        "200":
          description: Current user's persisted onboarding profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
    put:
      operationId: saveProfile
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Draft saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
  /profile/complete:
    post:
      operationId: completeProfile
      tags: [profile]
      responses:
        "200":
          description: Completed onboarding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
  /profile/incomes:
    post:
      operationId: createIncome
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncomeInput" }
      responses:
        "201":
          description: Saved source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Income" }
  /profile/incomes/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateIncome
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncomeInput" }
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Income" }
    delete:
      operationId: deleteIncome
      tags: [profile]
      responses:
        "204": { description: Deleted }
  /profile/scholarships:
    post:
      operationId: createScholarship
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarshipInput" }
      responses:
        "201":
          description: Saved scholarship or aid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scholarship" }
  /profile/scholarships/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateScholarship
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarshipInput" }
      responses:
        "200":
          description: Updated scholarship or aid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scholarship" }
    delete:
      operationId: deleteScholarship
      tags: [profile]
      responses:
        "204": { description: Deleted }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /family:
    get:
      operationId: getStudentFamily
      responses:
        "200":
          description: Student-owned family links and allowance projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentFamily" }
  /family/invitations:
    post:
      operationId: createFamilyInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FamilyConsentInput" }
      responses:
        "201":
          description: Private single-use token, displayed once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyInvitationReceipt" }
  /family/links/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateFamilyConsent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FamilyConsentInput" }
      responses:
        "200":
          description: Updated student consent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyLink" }
    delete:
      operationId: revokeFamilyLink
      responses:
        "204": { description: Revoked; financial history retained }
  /parent/family-invitations/decide:
    post:
      operationId: decideFamilyInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FamilyDecisionInput" }
      responses:
        "200":
          description: Accepted or declined without revealing unaccepted names
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyDecision" }
  /parent/dashboard:
    get:
      operationId: getParentDashboard
      responses:
        "200":
          description: Accepted children with strictly permission-filtered sections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentDashboard" }
  /parent/children/{childId}:
    parameters:
      - { name: childId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getParentChild
      responses:
        "200":
          description: Current consent-filtered child
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentChild" }
  /parent/wallet:
    get:
      operationId: getParentWallet
      responses:
        "200":
          description: Parent-owned simulated accounts and ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentWallet" }
  /parent/wallet/accounts:
    post:
      operationId: createParentAccount
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceAccountInput" }
      responses:
        "201":
          description: Zero-balance account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceAccount" }
  /parent/wallet/topups:
    post:
      operationId: topUpParentWallet
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParentTopUpInput" }
      responses:
        "201":
          description: Explicit simulated external top-up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceTransaction" }
  /parent/children/{childId}/allowances:
    parameters:
      - { name: childId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listChildAllowances
      responses:
        "200":
          description: Allowances funded by this parent only
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Allowance" } }
    post:
      operationId: createAllowance
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllowanceInput" }
      responses:
        "201":
          description: Schedule; due occurrences processed by server worker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Allowance" }
  /parent/children/{childId}/allowances/{id}:
    parameters:
      - { name: childId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateAllowance
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllowanceInput" }
      responses:
        "200":
          description: Edited future schedule; immutable posted history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Allowance" }
  /parent/children/{childId}/allowances/{id}/status:
    parameters:
      - { name: childId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: changeAllowanceStatus
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllowanceAction" }
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Allowance" }
  /parent/children/{childId}/allowances/{id}/retry:
    parameters:
      - { name: childId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: retryAllowance
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllowanceRetryInput" }
      responses:
        "200":
          description: Attempts the current due occurrence once; inspect lastFailure and occurrence status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Allowance" }
components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  schemas:
    FamilyPermissions:
      type: object
      additionalProperties: false
      required: [monthlySummary, balance, goals, allowance, requests, transactions, upcomingPayments, campusSpending]
      properties:
        monthlySummary: { type: boolean, default: false }
        balance: { type: boolean, default: false }
        goals: { type: boolean, default: false }
        allowance: { type: boolean, default: false }
        requests: { type: boolean, default: false }
        transactions: { type: boolean, default: false }
        upcomingPayments: { type: boolean, default: false }
        campusSpending: { type: boolean, default: false }
    FamilyConsentInput:
      type: object
      additionalProperties: false
      required: [permissions, receivingAccountId]
      properties:
        permissions: { $ref: "#/components/schemas/FamilyPermissions" }
        receivingAccountId: { type: [string, "null"], format: uuid }
    FamilyLink:
      type: object
      required: [id, status, permissions, receivingAccountId, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, accepted, declined, revoked] }
        permissions: { $ref: "#/components/schemas/FamilyPermissions" }
        receivingAccountId: { type: [string, "null"], format: uuid }
        parentName: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    FamilyInvitationReceipt:
      type: object
      required: [link, token]
      properties:
        link: { $ref: "#/components/schemas/FamilyLink" }
        token: { type: string }
    FamilyDecisionInput:
      type: object
      additionalProperties: false
      required: [token, action]
      properties:
        token: { type: string, minLength: 43, maxLength: 43 }
        action: { type: string, enum: [accept, decline] }
    FamilyDecision:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted, declined] }
        childId: { type: string, format: uuid }
        childName: { type: string }
    AllowanceInput:
      type: object
      additionalProperties: false
      required: [parentAccountId, amount, kind, frequency, nextPayment, startDate, endDate, note]
      properties:
        parentAccountId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/GoalPositiveAmount" }
        kind: { type: string, enum: [oneTime, recurring] }
        frequency: { type: [string, "null"], enum: [weekly, biweekly, monthly, null] }
        nextPayment: { type: string, format: date }
        startDate: { type: string, format: date }
        endDate: { type: [string, "null"], format: date }
        note: { type: string, maxLength: 500 }
    Allowance:
      allOf:
        - { $ref: "#/components/schemas/AllowanceInput" }
        - type: object
          required: [id, childId, status, lastFailure, occurrences, createdAt]
          properties:
            id: { type: string, format: uuid }
            childId: { type: string, format: uuid }
            status: { type: string, enum: [active, paused, cancelled, completed] }
            lastFailure: { type: [string, "null"], enum: [insufficient_funds, balance_limit, null] }
            occurrences:
              type: array
              items: { $ref: "#/components/schemas/AllowanceOccurrence" }
            createdAt: { type: string, format: date-time }
    AllowanceOccurrence:
      type: object
      required: [id, scheduledDate, amount, status, failure, transactionIds, attemptedAt]
      properties:
        id: { type: string, format: uuid }
        scheduledDate: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Amount" }
        status: { type: string, enum: [posted, failed, cancelled] }
        failure: { type: [string, "null"], enum: [insufficient_funds, balance_limit, null] }
        transactionIds: { type: array, items: { type: string, format: uuid } }
        attemptedAt: { type: string, format: date-time }
    AllowanceAction:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [pause, resume, cancel] }
    AllowanceRetryInput:
      type: object
      additionalProperties: false
      required: [retry]
      properties:
        retry: { type: boolean, enum: [true] }
    ParentTopUpInput:
      type: object
      additionalProperties: false
      required: [accountId, amount, simulatedFundingAcknowledged]
      properties:
        accountId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/GoalPositiveAmount" }
        simulatedFundingAcknowledged: { type: boolean, enum: [true] }
    ParentWallet:
      type: object
      required: [accounts, transactions, simulated]
      properties:
        accounts: { type: array, items: { $ref: "#/components/schemas/FinanceAccount" } }
        transactions: { type: array, items: { $ref: "#/components/schemas/FinanceTransaction" } }
        simulated: { type: boolean, enum: [true] }
    FamilyActivity:
      type: object
      required: [id, type, amount, direction, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        amount: { $ref: "#/components/schemas/Amount" }
        direction: { type: string, enum: [credit, debit] }
        createdAt: { type: string, format: date-time }
    FamilyMonthlySummary:
      type: object
      required: [currency, income, spending, campusIncluded]
      properties:
        currency: { type: string, enum: [ILS, USD, JOD] }
        income: { $ref: "#/components/schemas/Amount" }
        spending: { $ref: "#/components/schemas/Amount" }
        campusIncluded: { type: boolean }
    FamilyUpcoming:
      type: object
      required: [id, date, amount, source]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Amount" }
        source: { type: string, enum: [allowance, recurring, income, line] }
    FamilyRequests:
      type: object
      required: [status, items]
      properties:
        status: { type: string, enum: [coming_soon] }
        items: { type: array, maxItems: 0, items: { type: string } }
    ParentChild:
      type: object
      required: [childId, name, permissions]
      properties:
        childId: { type: string, format: uuid }
        name: { type: string }
        permissions: { $ref: "#/components/schemas/FamilyPermissions" }
        allowanceCurrency:
          description: Student-selected receiving account currency only; omitted without allowance permission. Does not disclose account ID or balance.
          type: string
          enum: [ILS, USD, JOD]
        balance: { type: array, items: { $ref: "#/components/schemas/Amount" } }
        monthlySummary: { type: array, items: { $ref: "#/components/schemas/FamilyMonthlySummary" } }
        income: { type: array, items: { $ref: "#/components/schemas/Amount" } }
        goals: { type: array, items: { $ref: "#/components/schemas/ParentFundingGoal" } }
        allowances: { type: array, items: { $ref: "#/components/schemas/Allowance" } }
        requests: { $ref: "#/components/schemas/FamilyRequests" }
        transactions: { type: array, items: { $ref: "#/components/schemas/FamilyActivity" } }
        upcomingPayments: { type: array, items: { $ref: "#/components/schemas/FamilyUpcoming" } }
        campusSpending: { type: array, items: { $ref: "#/components/schemas/Amount" } }
    ParentDashboard:
      type: object
      required: [children, simulated, requestsStatus, goalFundingPath]
      properties:
        children: { type: array, items: { $ref: "#/components/schemas/ParentChild" } }
        simulated: { type: boolean, enum: [true] }
        requestsStatus: { type: string, enum: [coming_soon] }
        goalFundingPath: { type: string, enum: [/goals/fund] }
    AllowanceProjection:
      type: object
      required: [policy, totals, upcoming]
      properties:
        policy: { type: string, enum: [inclusive_parent_allowance_envelope] }
        totals:
          type: array
          items: { $ref: "#/components/schemas/AllowanceProjectionTotal" }
        upcoming: { type: array, items: { $ref: "#/components/schemas/FamilyUpcoming" } }
    AllowanceProjectionTotal:
      type: object
      required: [currency, manualMonthly, scheduledMonthly, effectiveMonthly, adjustmentMonthly]
      properties:
        currency: { type: string, enum: [ILS, USD, JOD] }
        manualMonthly: { $ref: "#/components/schemas/Amount" }
        scheduledMonthly: { $ref: "#/components/schemas/Amount" }
        effectiveMonthly: { $ref: "#/components/schemas/Amount" }
        adjustmentMonthly: { $ref: "#/components/schemas/Amount" }
    StudentFamily:
      type: object
      required: [links, projection, allowances]
      properties:
        links: { type: array, items: { $ref: "#/components/schemas/FamilyLink" } }
        projection: { $ref: "#/components/schemas/AllowanceProjection" }
        allowances: { type: array, items: { $ref: "#/components/schemas/StudentAllowance" } }
    StudentAllowance:
      type: object
      required: [id, amount, kind, frequency, nextPayment, startDate, endDate, note, status, lastFailure, occurrences]
      properties:
        id: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Amount" }
        kind: { type: string, enum: [oneTime, recurring] }
        frequency: { type: [string, "null"], enum: [weekly, biweekly, monthly, null] }
        nextPayment: { type: string, format: date }
        startDate: { type: string, format: date }
        endDate: { type: [string, "null"], format: date }
        note: { type: string }
        status: { type: string, enum: [active, paused, cancelled, completed] }
        lastFailure: { type: [string, "null"], enum: [insufficient_funds, balance_limit, null] }
        occurrences: { type: array, items: { $ref: "#/components/schemas/AllowanceOccurrence" } }
    GoalPositiveAmount:
      type: object
      additionalProperties: false
      required: [minor, currency]
      properties:
        minor: { type: integer, minimum: 1, maximum: 9007199254740991 }
        currency: { type: string, enum: [ILS, USD, JOD] }
    SavingsGoalInput:
      type: object
      additionalProperties: false
      required: [name, target, targetDate, category, priority, notes]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        target: { $ref: "#/components/schemas/GoalPositiveAmount" }
        targetDate: { type: [string, "null"], format: date }
        category: { type: string, minLength: 1, maxLength: 80 }
        priority: { type: string, enum: [low, medium, high] }
        notes: { type: string, maxLength: 2000 }
    SavingsGoalStatus:
      type: string
      enum: [active, paused, completed, archived]
    SavingsGoal:
      allOf:
        - { $ref: "#/components/schemas/SavingsGoalInput" }
        - type: object
          required: [id, currency, current, status, percentage, remaining, requiredContributionMonthly, estimatedCompletion, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            currency: { type: string, enum: [ILS, USD, JOD] }
            current: { $ref: "#/components/schemas/Amount" }
            status: { $ref: "#/components/schemas/SavingsGoalStatus" }
            percentage: { type: number, minimum: 0, maximum: 100 }
            remaining: { $ref: "#/components/schemas/Amount" }
            requiredContributionMonthly:
              description: Null without deadline or when inactive; exact ceiling of remaining over inclusive UTC calendar months through deadline, minimum one month.
              anyOf: [{ $ref: "#/components/schemas/Amount" }, { type: "null" }]
            estimatedCompletion: { type: [string, "null"], format: date }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    SavingsGoalAction:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [pause, resume, complete, archive] }
    GoalCurrencyTotals:
      type: object
      required: [currency, available, reserved, netBalance, requiredContributionMonthly]
      properties:
        currency: { type: string, enum: [ILS, USD, JOD] }
        available: { $ref: "#/components/schemas/Amount" }
        reserved: { $ref: "#/components/schemas/Amount" }
        netBalance: { $ref: "#/components/schemas/Amount" }
        requiredContributionMonthly: { $ref: "#/components/schemas/Amount" }
    GoalFilterOption:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    GoalPlanSavings:
      type: object
      required: [currency, goalRequired, manualSavings, effectiveSavings, undatedActiveCount, policy]
      properties:
        currency: { type: string, enum: [ILS, USD, JOD] }
        goalRequired: { $ref: "#/components/schemas/Amount" }
        manualSavings: { $ref: "#/components/schemas/Amount" }
        effectiveSavings: { $ref: "#/components/schemas/Amount" }
        undatedActiveCount: { type: integer, minimum: 0 }
        policy: { type: string, enum: [maximum_manual_or_goals] }
    SavingsGoalsOverview:
      type: object
      required: [goals, totals, activeCount, completedCount, policy]
      properties:
        goals: { type: array, items: { $ref: "#/components/schemas/SavingsGoal" } }
        totals: { type: array, items: { $ref: "#/components/schemas/GoalCurrencyTotals" } }
        activeCount: { type: integer, minimum: 0 }
        completedCount: { type: integer, minimum: 0 }
        policy: { type: string }
    StudentGoalContributionInput:
      type: object
      additionalProperties: false
      required: [accountId, amount]
      properties:
        accountId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/GoalPositiveAmount" }
        note: { type: string, maxLength: 500 }
    ParentGoalContributionInput:
      type: object
      additionalProperties: false
      required: [amount, simulatedFundingAcknowledged]
      properties:
        amount: { $ref: "#/components/schemas/GoalPositiveAmount" }
        simulatedFundingAcknowledged: { type: boolean, enum: [true] }
        note: { type: string, maxLength: 500 }
    GoalHistoryEntry:
      type: object
      required: [id, goalId, action, source, amount, transactionIds, note, createdAt]
      properties:
        id: { type: string, format: uuid }
        goalId: { type: string, format: uuid }
        action: { type: string, enum: [created, edited, contribution, paused, resumed, completed, archived] }
        source: { type: [string, "null"], enum: [student_account, parent_simulated, null] }
        amount:
          anyOf: [{ $ref: "#/components/schemas/Amount" }, { type: "null" }]
        transactionIds: { type: array, items: { type: string, format: uuid } }
        note: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    GoalContributionReceipt:
      type: object
      required: [goal, entry, transactions]
      properties:
        goal: { $ref: "#/components/schemas/SavingsGoal" }
        entry: { $ref: "#/components/schemas/GoalHistoryEntry" }
        transactions: { type: array, items: { $ref: "#/components/schemas/FinanceTransaction" } }
    GoalConsentInput:
      type: object
      additionalProperties: false
      required: [limitedConsentAcknowledged]
      properties:
        limitedConsentAcknowledged: { type: boolean, enum: [true] }
    GoalInvitation:
      type: object
      required: [id, goalId, expiresAt, redeemedAt, revokedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        goalId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        redeemedAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    GoalInvitationCreated:
      type: object
      required: [invitation, token]
      properties:
        invitation: { $ref: "#/components/schemas/GoalInvitation" }
        token: { type: string }
    GoalInvitationRedemption:
      type: object
      additionalProperties: false
      required: [token, limitedConsentAcknowledged]
      properties:
        token: { type: string, minLength: 43, maxLength: 128 }
        limitedConsentAcknowledged: { type: boolean, enum: [true] }
    ParentFundingGoal:
      type: object
      description: Deliberately excludes student identity, accounts, notes, history and unrelated goals.
      required: [id, name, target, current, remaining, status, targetDate]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        target: { $ref: "#/components/schemas/Amount" }
        current: { $ref: "#/components/schemas/Amount" }
        remaining: { $ref: "#/components/schemas/Amount" }
        status: { $ref: "#/components/schemas/SavingsGoalStatus" }
        targetDate: { type: [string, "null"], format: date }
    ParentGoalContributionReceipt:
      type: object
      required: [id, goal, amount, source, createdAt]
      properties:
        id: { type: string, format: uuid }
        goal: { $ref: "#/components/schemas/ParentFundingGoal" }
        amount: { $ref: "#/components/schemas/Amount" }
        source: { type: string, enum: [parent_simulated] }
        createdAt: { type: string, format: date-time }
    PlanningCategory:
      type: string
      enum: [tuition, registration, university_fees, transportation, food, cafeteria, housing, accommodation, rent, utilities, internet, books, bookstore, printing, academic_supplies, subscriptions, personal, shopping, savings, fees, campus_transportation, other]
    BudgetInput:
      type: object
      additionalProperties: false
      required: [category, period, limit]
      properties:
        category: { $ref: "#/components/schemas/PlanningCategory" }
        period: { type: string, enum: [weekly, monthly] }
        limit: { $ref: "#/components/schemas/Amount" }
    Budget:
      type: object
      required: [id, category, period, limit, actualSpent, remaining, periodStart, periodEnd]
      properties:
        id: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/PlanningCategory" }
        period: { type: string, enum: [weekly, monthly] }
        limit: { $ref: "#/components/schemas/Amount" }
        actualSpent: { $ref: "#/components/schemas/Amount" }
