openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: App-owned credentials and sessions
  - name: profile
    description: Owner-only onboarding
  - name: finance
    description: Simulated student finance
  - name: campus
    description: Simulated campus catalog
paths:
  /finance/accounts:
    get:
      operationId: listFinanceAccounts
      tags: [finance]
      responses:
        "200":
          description: Owner accounts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FinanceAccount" } }
    post:
      operationId: createFinanceAccount
      tags: [finance]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceAccountInput" } } } }
      responses:
        "201":
          description: Zero-balance account
          content: { application/json: { schema: { $ref: "#/components/schemas/FinanceAccount" } } }
  /finance/accounts/{id}:
    get:
      operationId: getFinanceAccount
      tags: [finance]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Account details
          content: { application/json: { schema: { $ref: "#/components/schemas/FinanceAccount" } } }
  /finance/recipients/{id}:
    get:
      operationId: lookupFinanceRecipient
      tags: [finance]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Minimal verified recipient identity; never reveals balances
          content: { application/json: { schema: { $ref: "#/components/schemas/FinanceRecipient" } } }
  /finance/transactions:
    get:
      operationId: listFinanceTransactions
      tags: [finance]
      responses:
        "200":
          description: Recent owner ledger entries
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FinanceTransaction" } } } }
  /finance/history:
    get:
      operationId: getFinanceHistory
      tags: [finance]
      description: Owner-only immutable ledger, newest first by createdAt then id. Dates are inclusive UTC calendar days; amounts are integer minor units in amountCurrency.
      parameters:
        - { in: query, name: search, schema: { type: string, minLength: 1, maxLength: 120 } }
        - { in: query, name: category, schema: { type: string, maxLength: 80 } }
        - { in: query, name: type, schema: { $ref: "#/components/schemas/FinanceSemanticType" } }
        - { in: query, name: dateFrom, schema: { type: string, format: date } }
        - { in: query, name: dateTo, schema: { type: string, format: date } }
        - { in: query, name: amountMin, schema: { type: integer, minimum: 0, maximum: 9007199254740991 } }
        - { in: query, name: amountMax, schema: { type: integer, minimum: 0, maximum: 9007199254740991 } }
        - { in: query, name: amountCurrency, schema: { type: string, enum: [ILS, USD, JOD] } }
        - { in: query, name: accountId, schema: { type: string, format: uuid } }
        - { in: query, name: parentTransferId, schema: { type: string, format: uuid } }
        - { in: query, name: campusId, schema: { type: string, format: uuid } }
        - { in: query, name: universityId, schema: { type: string, format: uuid } }
        - { in: query, name: goalId, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 100000 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Filtered owner ledger; empty items with total 0 means no matches
          content: { application/json: { schema: { $ref: "#/components/schemas/FinanceHistoryPage" } } }
  /finance/history/filter-options:
    get:
      operationId: getFinanceHistoryFilterOptions
      tags: [finance]
      responses:
        "200":
          description: Static bilingual taxonomy plus owner-derived account and campus facets; goals are not implemented
          content: { application/json: { schema: { $ref: "#/components/schemas/FinanceHistoryFilterOptions" } } }
  /finance/transactions/{id}:
    get:
      operationId: getFinanceTransaction
      tags: [finance]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Immutable owner receipt
          content: { application/json: { schema: { $ref: "#/components/schemas/FinanceTransaction" } } }
  /finance/movements:
    post:
      operationId: createFinanceMovement
      tags: [finance]
      description: Simulated external receive/deposit/add or send/withdrawal, or atomic transfer to an exact account identifier. All require a unique Idempotency-Key header.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceMovementInput" } } } }
      responses:
        "201":
          description: Immutable receipt
          content: { application/json: { schema: { $ref: "#/components/schemas/FinanceTransaction" } } }
  /finance/requests:
    get:
      operationId: listMoneyRequests
      tags: [finance]
      responses:
        "200":
          description: Requests issued or addressed to owner
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MoneyRequest" } } } }
    post:
      operationId: createMoneyRequest
      tags: [finance]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MoneyRequestInput" } } } }
      responses:
        "201":
          description: Pending request
          content: { application/json: { schema: { $ref: "#/components/schemas/MoneyRequest" } } }
  /finance/requests/{id}/decision:
    post:
      operationId: decideMoneyRequest
      tags: [finance]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MoneyRequestDecision" } } } }
      responses:
        "200":
          description: Updated request
          content: { application/json: { schema: { $ref: "#/components/schemas/MoneyRequest" } } }
  /finance/summary:
    get:
      operationId: getFinanceSummary
      tags: [finance]
      responses:
        "200":
          description: Derived per-currency monthly cashflow and category totals, not a budget or forecast
          content: { application/json: { schema: { $ref: "#/components/schemas/FinanceSummary" } } }
  /campus/catalog:
    get:
      operationId: listCampusCatalog
      tags: [campus]
      responses:
        "200":
          description: Configured campuses and services
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CampusUniversity" } } } }
  /campus/demo/install:
    post:
      operationId: installCampusDemo
      tags: [campus]
      description: Authenticated student opt-in install of a global fictional demo catalog. Idempotent; no credentials or balance seeds.
      responses:
        "200":
          description: Current catalog including persisted demo
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CampusUniversity" } } } }
  /campus/admin/universities:
    post:
      operationId: createCampusUniversity
      tags: [campus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampusUniversityInput" } } } }
      responses:
        "201":
          description: Created university
          content: { application/json: { schema: { $ref: "#/components/schemas/CampusUniversity" } } }
  /campus/admin/universities/{id}:
    put:
      operationId: updateCampusUniversity
      tags: [campus]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampusUniversityInput" } } } }
      responses:
        "200":
          description: Updated university
          content: { application/json: { schema: { $ref: "#/components/schemas/CampusUniversity" } } }
  /campus/admin/campuses:
    post:
      operationId: createCampus
      tags: [campus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampusInput" } } } }
      responses:
        "201":
          description: Created campus
          content: { application/json: { schema: { $ref: "#/components/schemas/Campus" } } }
  /campus/admin/campuses/{id}:
    put:
      operationId: updateCampus
      tags: [campus]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampusInput" } } } }
      responses:
        "200":
          description: Updated campus
          content: { application/json: { schema: { $ref: "#/components/schemas/Campus" } } }
  /campus/admin/services:
    post:
      operationId: createCampusService
      tags: [campus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampusServiceInput" } } } }
      responses:
        "201":
          description: Created merchant/service
          content: { application/json: { schema: { $ref: "#/components/schemas/CampusService" } } }
  /campus/admin/services/{id}:
    put:
      operationId: updateCampusService
      tags: [campus]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampusServiceInput" } } } }
      responses:
        "200":
          description: Updated service
          content: { application/json: { schema: { $ref: "#/components/schemas/CampusService" } } }
    delete:
      operationId: archiveCampusService
      tags: [campus]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: "Archived from payments; retained for historical receipts" }
  /campus/admin/products:
    post:
      operationId: createCampusProduct
      tags: [campus]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampusProductInput" } } } }
      responses:
        "201":
          description: Created price
          content: { application/json: { schema: { $ref: "#/components/schemas/CampusProduct" } } }
  /campus/admin/products/{id}:
    put:
      operationId: updateCampusProduct
      tags: [campus]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampusProductInput" } } } }
      responses:
        "200":
          description: Updated price
          content: { application/json: { schema: { $ref: "#/components/schemas/CampusProduct" } } }
    delete:
      operationId: archiveCampusProduct
      tags: [campus]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: "Archived from payments; retained for historical receipts" }
  /campus/payments:
    post:
      operationId: createCampusPayment
      tags: [campus]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampusPaymentInput" } } } }
      responses:
        "201":
          description: Simulated payment receipt with server-priced items
          content: { application/json: { schema: { $ref: "#/components/schemas/FinanceTransaction" } } }
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignUpInput" }
      responses:
        "201":
          description: Registered and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /auth/login:
    post:
      operationId: logIn
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /auth/logout:
    post:
      operationId: logOut
      tags: [auth]
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogoutResult" }
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Authenticated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      responses:
        "200":
          description: Current user's persisted onboarding profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
    put:
      operationId: saveProfile
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Draft saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
  /profile/complete:
    post:
      operationId: completeProfile
      tags: [profile]
      responses:
        "200":
          description: Completed onboarding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
  /profile/incomes:
    post:
      operationId: createIncome
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncomeInput" }
      responses:
        "201":
          description: Saved source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Income" }
  /profile/incomes/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateIncome
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncomeInput" }
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Income" }
    delete:
      operationId: deleteIncome
      tags: [profile]
      responses:
        "204": { description: Deleted }
  /profile/scholarships:
    post:
      operationId: createScholarship
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarshipInput" }
      responses:
        "201":
          description: Saved scholarship or aid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scholarship" }
  /profile/scholarships/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateScholarship
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScholarshipInput" }
      responses:
        "200":
          description: Updated scholarship or aid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scholarship" }
    delete:
      operationId: deleteScholarship
      tags: [profile]
      responses:
        "204": { description: Deleted }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  schemas:
    FinanceRecipient:
      type: object
      required: [accountId, name, currency]
      properties:
        accountId: { type: string, format: uuid }
        name: { type: string }
        currency: { type: string, enum: [ILS, USD, JOD] }
    FinanceAccountInput:
      type: object
      additionalProperties: false
      required: [type, name, currency]
      properties:
        type: { type: string, enum: [wallet, bank, cash, other] }
        name: { type: string, minLength: 1, maxLength: 120 }
        currency: { type: string, enum: [ILS, USD, JOD] }
    FinanceAccount:
      allOf:
        - { $ref: "#/components/schemas/FinanceAccountInput" }
        - type: object
          required: [id, balance]
          properties:
            id: { type: string, format: uuid }
            balance: { $ref: "#/components/schemas/Amount" }
    FinanceMovementInput:
      type: object
      additionalProperties: false
      required: [kind, accountId, amount]
      properties:
        kind: { type: string, enum: [add, receive, deposit, withdrawal, send, transfer, payment] }
        accountId: { type: string, format: uuid }
        recipientAccountId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Amount" }
        note: { type: string, maxLength: 300 }
    MoneyRequestInput:
      type: object
      additionalProperties: false
      required: [recipientAccountId, payerAccountId, amount]
      properties:
        recipientAccountId: { type: string, format: uuid }
        payerAccountId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Amount" }
        note: { type: string, maxLength: 300 }
    MoneyRequestDecision:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [fulfill, decline, cancel] }
    MoneyRequest:
      allOf:
        - { $ref: "#/components/schemas/MoneyRequestInput" }
        - type: object
          required: [id, issuerId, payerId, status, createdAt]
          properties:
            id: { type: string, format: uuid }
            issuerId: { type: string, format: uuid }
            payerId: { type: string, format: uuid }
            status: { type: string, enum: [pending, fulfilled, declined, cancelled] }
            transactionId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    FinanceReceiptItem:
      type: object
      required: [productId, name, quantity, unitPrice, lineTotal]
      properties:
        productId: { type: string, format: uuid }
        name: { type: string }
        quantity: { type: integer }
        unitPrice: { $ref: "#/components/schemas/Amount" }
        lineTotal: { $ref: "#/components/schemas/Amount" }
    FinanceSemanticType:
      type: string
      enum: [income, expense, transfer, allowance, refund, savings, withdrawal, deposit, payment, campus_payment]
    FinanceHistoryPage:
      type: object
      required: [items, page, limit, total, hasMore]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FinanceTransaction" } }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        hasMore: { type: boolean }
    FinanceHistoryFilterOptions:
      type: object
      required: [categories, accounts, universities, campuses, goals]
      properties:
        categories:
          type: array
          items:
            type: object
            required: [group, key, label, arabicLabel]
            properties:
              group: { type: string, enum: [university, school, campus, legacy] }
              key: { type: string }
              label: { type: string }
              arabicLabel: { type: string }
        accounts:
          type: array
          items:
            type: object
            required: [id, name, currency]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              currency: { type: string, enum: [ILS, USD, JOD] }
        universities:
          type: array
          items:
            type: object
            required: [id, name, arabicName]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              arabicName: { type: string }
        campuses:
          type: array
          items:
            type: object
            required: [id, universityId, name, arabicName]
            properties:
              id: { type: string, format: uuid }
              universityId: { type: string, format: uuid }
              name: { type: string }
              arabicName: { type: string }
        goals: { type: array, items: { type: string, format: uuid } }
    FinanceTransaction:
      type: object
      required: [id, userId, accountId, kind, type, category, direction, amount, balanceAfter, status, createdAt, description, source, destination, relatedGoalId, relatedBudgetId, parentTransferId, campusServiceId, universityId, campusId, recurringExpenseId]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        kind: { type: string }
        type: { $ref: "#/components/schemas/FinanceSemanticType" }
        category: { type: string }
        direction: { type: string, enum: [credit, debit] }
        amount: { $ref: "#/components/schemas/Amount" }
        balanceAfter: { $ref: "#/components/schemas/Amount" }
        status: { type: string, enum: [simulated, simulated_payment] }
        counterpartyAccountId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        merchantName: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/FinanceReceiptItem" } }
        note: { type: string }
        createdAt: { type: string, format: date-time }
        description: { type: string }
        source: { type: ["string", "null"] }
        destination: { type: ["string", "null"] }
        accountName: { type: string }
        relatedGoalId: { type: ["string", "null"], format: uuid }
        relatedBudgetId: { type: ["string", "null"], format: uuid }
        parentTransferId: { type: ["string", "null"], format: uuid }
        campusServiceId: { type: ["string", "null"], format: uuid }
        universityId: { type: ["string", "null"], format: uuid }
        campusId: { type: ["string", "null"], format: uuid }
        universityName: { type: ["string", "null"] }
        campusName: { type: ["string", "null"] }
        recurringExpenseId: { type: ["string", "null"], format: uuid }
    FinanceCategoryTotal:
      type: object
      required: [currency, category, spending]
      properties:
        currency: { type: string, enum: [ILS, USD, JOD] }
        category: { type: string }
        spending: { $ref: "#/components/schemas/Amount" }
    FinanceCashflow:
      type: object
      required: [currency, balance, monthlyIncome, monthlySpending]
      properties:
        currency: { type: string, enum: [ILS, USD, JOD] }
        balance: { $ref: "#/components/schemas/Amount" }
        monthlyIncome: { $ref: "#/components/schemas/Amount" }
        monthlySpending: { $ref: "#/components/schemas/Amount" }
    FinanceSummary:
      type: object
      required: [cashflow, categoryTotals, upcomingRequests, recentTransactions, campusActivity]
      properties:
        cashflow: { type: array, items: { $ref: "#/components/schemas/FinanceCashflow" } }
        categoryTotals: { type: array, items: { $ref: "#/components/schemas/FinanceCategoryTotal" } }
        upcomingRequests: { type: array, items: { $ref: "#/components/schemas/MoneyRequest" } }
        recentTransactions: { type: array, items: { $ref: "#/components/schemas/FinanceTransaction" } }
        campusActivity: { type: array, items: { $ref: "#/components/schemas/FinanceTransaction" } }
    CampusUniversityInput:
      type: object
      additionalProperties: false
      required: [name, arabicName]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        arabicName: { type: string, minLength: 1, maxLength: 160 }
    CampusUniversity:
      allOf:
        - { $ref: "#/components/schemas/CampusUniversityInput" }
        - type: object
          required: [id, campuses]
          properties:
            id: { type: string, format: uuid }
            campuses: { type: array, items: { $ref: "#/components/schemas/Campus" } }
    CampusInput:
      type: object
      additionalProperties: false
      required: [universityId, name, arabicName]
      properties:
        universityId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 160 }
        arabicName: { type: string, minLength: 1, maxLength: 160 }
    Campus:
      allOf:
        - { $ref: "#/components/schemas/CampusInput" }
        - type: object
          required: [id, services]
          properties:
            id: { type: string, format: uuid }
            services: { type: array, items: { $ref: "#/components/schemas/CampusService" } }
    CampusServiceInput:
      type: object
      additionalProperties: false
      required: [campusId, name, arabicName, category, description, location, active, paymentEnabled]
      properties:
        campusId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 160 }
        arabicName: { type: string, minLength: 1, maxLength: 160 }
        category: { type: string, enum: [food, books, printing, transportation, fees, other] }
        description: { type: string, maxLength: 500 }
        location: { type: string, maxLength: 300 }
        active: { type: boolean }
        paymentEnabled: { type: boolean }
    CampusService:
      allOf:
        - { $ref: "#/components/schemas/CampusServiceInput" }
        - type: object
          required: [id, universityId, integrationStatus, products]
          properties:
            id: { type: string, format: uuid }
            universityId: { type: string, format: uuid }
            integrationStatus: { type: string, enum: [simulated] }
            products: { type: array, items: { $ref: "#/components/schemas/CampusProduct" } }
    CampusProductInput:
      type: object
      additionalProperties: false
      required: [serviceId, name, arabicName, price, active]
      properties:
        serviceId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 160 }
        arabicName: { type: string, minLength: 1, maxLength: 160 }
        price: { $ref: "#/components/schemas/Amount" }
        active: { type: boolean }
    CampusProduct:
      allOf:
        - { $ref: "#/components/schemas/CampusProductInput" }
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    CampusPaymentInput:
      type: object
      additionalProperties: false
      required: [accountId, serviceId, items]
      properties:
        accountId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [productId, quantity]
            properties:
              productId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 100 }
    SignUpInput:
      type: object
      additionalProperties: false
      required: [name, email, password, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
        role: { type: string, enum: [student, parent] }
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string }
    Account:
      type: object
      required: [id, name, email, role, onboardingCompleted]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [student, parent, admin] }
        onboardingCompleted: { type: boolean }
    LogoutResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    Amount:
      type: object
      additionalProperties: false
      required: [minor, currency]
      properties:
        minor: { type: integer, minimum: 0, maximum: 9007199254740991 }
        currency: { type: string, enum: [ILS, USD, JOD] }
    Education:
      type: object
      additionalProperties: false
      required: [studentType]
      properties:
        studentType: { type: string, enum: [school, university] }
        school: { type: string, maxLength: 160 }
        city: { type: string, maxLength: 160 }
        grade: { type: string, maxLength: 100 }
        allowanceFrequency: { type: string, enum: [daily, weekly, monthly, quarterly, yearly, irregular] }
        typicalAllowance: { $ref: "#/components/schemas/Amount" }
        university: { type: string, maxLength: 160 }
        campus: { type: string, maxLength: 160 }
        faculty: { type: string, maxLength: 160 }
        major: { type: string, maxLength: 160 }
        academicYear: { type: string, maxLength: 100 }
        studyStatus: { type: string, maxLength: 100 }
    Residence:
      type: object
      additionalProperties: false
      required: [type, city]
      properties:
        type: { type: string, enum: [family, university_housing, shared, private, other] }
        city: { type: string, maxLength: 160 }
        monthlyRent: { $ref: "#/components/schemas/Amount" }
        studentShare: { $ref: "#/components/schemas/Amount" }
        utilities: { $ref: "#/components/schemas/Amount" }
        internet: { $ref: "#/components/schemas/Amount" }
        deposit: { $ref: "#/components/schemas/Amount" }
    Commute:
      type: object
      additionalProperties: false
      required: [homeCity, method, tripsPerWeek, costPerTrip, roundTrip, monthlyEstimate]
      description: "Monthly estimate in costPerTrip currency minor units. Convention: 52 weeks per 12 months, rounded to nearest minor unit; roundTrip doubles one-way trip cost. manualEstimate=true permits explicit override."
      properties:
        homeCity: { type: string, maxLength: 160 }
        university: { type: string, maxLength: 160 }
        campus: { type: string, maxLength: 160 }
        method: { type: string, enum: [walking, private_car, family_ride, taxi, shared_taxi, bus, other] }
        tripsPerWeek: { type: integer, minimum: 0, maximum: 100 }
        costPerTrip: { $ref: "#/components/schemas/Amount" }
        roundTrip: { type: boolean }
        monthlyEstimate: { $ref: "#/components/schemas/Amount" }
        manualEstimate: { type: boolean }
    ProfileInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        education: { $ref: "#/components/schemas/Education" }
        residence: { $ref: "#/components/schemas/Residence" }
        commute: { $ref: "#/components/schemas/Commute" }
    IncomeInput:
      type: object
      additionalProperties: false
      required: [source, amount, frequency, stability, active]
      properties:
        source: { type: string, enum: [parent_allowance, family_support, scholarship, financial_aid, student_loan, salary, part_time, full_time, freelance, internship, business_project, gift, other] }
        amount: { $ref: "#/components/schemas/Amount" }
        frequency: { type: string, enum: [daily, weekly, biweekly, monthly, quarterly, yearly, one_time, irregular] }
        expectedDate: { type: string, format: date }
        stability: { type: string, enum: [stable, variable] }
        description: { type: string, maxLength: 500 }
        active: { type: boolean }
    Income:
      allOf:
        - $ref: "#/components/schemas/IncomeInput"
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    ScholarshipInput:
      type: object
      additionalProperties: false
      required: [name, provider, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        provider: { type: string, minLength: 1, maxLength: 160 }
        type: { type: string, enum: [scholarship, financial_aid, grant, other] }
        amount: { $ref: "#/components/schemas/Amount" }
        percentage: { type: integer, minimum: 0, maximum: 100 }
        tuitionCoverage: { type: string, maxLength: 160 }
        paymentSchedule: { type: string, maxLength: 160 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        renewalDate: { type: string, format: date }
        remainingCoverage: { $ref: "#/components/schemas/Amount" }
        notes: { type: string, maxLength: 1000 }
    Scholarship:
      allOf:
        - $ref: "#/components/schemas/ScholarshipInput"
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    Profile:
      type: object
      required: [name, email, role, onboardingCompleted, incomes, scholarships]
      properties:
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [student, parent, admin] }
        onboardingCompleted: { type: boolean }
        education: { $ref: "#/components/schemas/Education" }
        residence: { $ref: "#/components/schemas/Residence" }
        commute: { $ref: "#/components/schemas/Commute" }
        incomes:
          type: array
          items: { $ref: "#/components/schemas/Income" }
        scholarships:
          type: array
          items: { $ref: "#/components/schemas/Scholarship" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

